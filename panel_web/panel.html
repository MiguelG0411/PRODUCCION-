<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Minera Anita</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icons/anita-marca.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/panel/panel.css">
</head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-res" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
 <symbol id="i-sim" viewBox="0 0 24 24"><path d="M3 20h18M5 20V10l4 3V9l4 3V6l4 3v11"/><path d="M17 5h3v15"/></symbol>
 <symbol id="i-rep" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
 <symbol id="i-prod" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
 <symbol id="i-pla" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 14h9"/></symbol>
 <symbol id="i-min" viewBox="0 0 24 24"><path d="M2 20l6-10 4 6 3-4 7 8z"/><path d="M8 10l2-3"/></symbol>
 <symbol id="i-pal" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></symbol>
 <symbol id="i-ins" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
 <symbol id="i-usr" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 20a6.5 6.5 0 0 0-2.5-5.2"/></symbol>
 <symbol id="i-man" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></symbol>
 <symbol id="i-ref" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
 <symbol id="i-out" viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h11"/></symbol>
</svg>
<aside class="side" id="side">
 <div class="brand"><div class="logo"><img src="/icons/logo-anita.png" alt="Minera Anita SpA"></div><small>Panel de gestión · sulfato de cobre</small></div>
 <nav id="nav">
  <div class="navt">General</div>
  <button class="nav" data-v="resumen"><svg><use href="#i-res"/></svg>Resumen</button>
  <button class="nav" data-v="simulador"><svg><use href="#i-sim"/></svg>Simulador de planta</button>
  <button class="nav" data-v="reportes"><svg><use href="#i-rep"/></svg>Reportes</button>
  <div class="navt">Operación</div>
  <button class="nav" data-v="prod"><svg><use href="#i-prod"/></svg>Producción</button>
  <button class="nav" data-v="pla"><svg><use href="#i-pla"/></svg>Planta · control químico</button>
  <button class="nav" data-v="min"><svg><use href="#i-min"/></svg>Mineral y pilas</button>
  <button class="nav" data-v="pal"><svg><use href="#i-pal"/></svg>Bodega y despachos</button>
  <button class="nav" data-v="ins"><svg><use href="#i-ins"/></svg>Insumos</button>
  <button class="nav" data-v="mantencion"><svg><use href="#i-man"/></svg>Mantención <span class="navtag">maqueta</span></button>
  <div class="navt adm" hidden>Administración</div>
  <button class="nav adm" data-v="usuarios" hidden><svg><use href="#i-usr"/></svg>Usuarios y accesos</button>
 </nav>
 <div class="foot"><span class="sync-dot"></span><span id="sync">Conectando…</span><br>Diseñado por BG Solutions</div>
</aside>
<div class="main">
 <header class="top">
  <button class="menu" id="menuBtn" aria-label="Menú">☰</button>
  <div class="tt"><h2 id="tTitle">Resumen</h2><div class="sub" id="tSub"></div></div>
  <div class="sp"></div>
  <div class="daynav" id="dayNav" hidden><button id="dPrev" aria-label="Día anterior">‹</button><input type="date" id="dDay" aria-label="Día"><button id="dNext" aria-label="Día siguiente">›</button></div>
  <button class="btn g" id="updBtn"><svg class="ico"><use href="#i-ref"/></svg><span>Actualizar</span></button>
  <div class="user"><div class="av" id="uAv">·</div><div class="un"><span id="uName">…</span><small id="uRol"></small></div>
   <button class="out" id="outBtn" title="Cerrar sesión" aria-label="Cerrar sesión"><svg class="ico"><use href="#i-out"/></svg></button></div>
 </header>
 <div class="warn" id="warn" hidden></div>
 <section class="view" id="vResumen"></section>
 <section class="view" id="vSimulador" hidden></section>
 <section class="view" id="vReportes" hidden></section>
 <section class="view" id="vUsuarios" hidden></section>
 <section class="view" id="vMantencion" hidden></section>
 <section class="view frame" id="vApp" hidden><iframe id="app" title="Datos de producción" src="/panel/app/?embed=1"></iframe></section>
 <div class="loading" id="loading"><div class="spin"></div><span id="loadTxt">Cargando datos de las planillas…</span></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/panel/panel.js" nonce="{{NONCE}}"></script>
</body></html>
